<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nanzbee Panel</title>
<style>
:root{--bg:#17181c;--side:#22242a;--card:#22242a;--line:#32353d;--text:#e8e9ed;--mute:#8a8a94;--acc:#1E9BFF;--ok:#46D369;--bad:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:380px}
.box h1{margin:0 0 4px;font-size:20px}
.box p{margin:0 0 16px;color:var(--mute);font-size:13px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;background:#17181c;border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.btn{background:var(--acc);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.box .btn{width:100%;margin-top:18px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
#app{display:flex;min-height:100vh}
nav{width:148px;background:var(--side);padding:16px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav h2{font-size:14px;margin:0 6px 14px}
nav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mute)}
nav button.on{background:#2d3038;color:#fff}
nav .sp{flex:1}
main{flex:1;padding:20px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card .n{font-size:30px;font-weight:700}
.card .l{color:var(--mute);font-size:12px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{max-width:280px}
.chk{display:flex;align-items:center;gap:6px;color:var(--mute);cursor:pointer;white-space:nowrap}
.chk input{width:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.on{background:var(--ok)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
td select{padding:5px 8px;min-width:120px}
.tag{font-size:11px;background:#2d3038;border-radius:6px;padding:2px 7px;color:var(--acc)}
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#3a3d46;border-radius:20px;cursor:pointer;transition:.15s}
.sw span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(16px)}
.empty{padding:24px;text-align:center;color:var(--mute)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2d3038;border:1px solid var(--line);padding:9px 16px;border-radius:8px;z-index:9}
.toast.bad{border-color:var(--bad)}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.row input{max-width:420px}
@media(max-width:640px){#app{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px}nav h2{display:none}nav .sp{display:none}main{padding:12px}}
</style>
</head>
<body>

<!-- First run: project URL + publishable key -->
<div id="vSetup" class="center hidden">
  <form class="box" id="fSetup">
    <h1>Nanzbee Panel</h1>
    <p>One-time setup. Stored only in this browser.</p>
    <label>Project URL</label>
    <input id="sUrl" placeholder="https://xxxx.supabase.co" autocomplete="off" required>
    <label>Publishable key</label>
    <input id="sKey" placeholder="sb_publishable_..." autocomplete="off" required>
    <div class="err" id="eSetup"></div>
    <button class="btn" type="submit">Save</button>
  </form>
</div>

<!-- Login -->
<div id="vLogin" class="center hidden">
  <form class="box" id="fLogin">
    <h1>Nanzbee Panel</h1>
    <p>Admin sign in</p>
    <label>Email</label>
    <input id="lEmail" type="email" autocomplete="username" required>
    <label>Password</label>
    <input id="lPass" type="password" autocomplete="current-password" required>
    <div class="err" id="eLogin"></div>
    <button class="btn" type="submit" id="bLogin">Sign in</button>
    <button class="btn ghost" type="button" id="bReset" style="margin-top:8px">Change project settings</button>
  </form>
</div>

<!-- App -->
<div id="app" class="hidden">
  <nav>
    <h2>Nanzbee Panel</h2>
    <button data-p="dash" class="on">Dashboard</button>
    <button data-p="dev">Devices</button>
    <button data-p="dom">Domains</button>
    <div class="sp"></div>
    <button id="bOut">Sign out</button>
  </nav>
  <main>
    <div class="top">
      <h1 id="title">Dashboard</h1>
      <span id="stamp" style="color:var(--mute);font-size:12px"></span>
      <button class="btn ghost" id="bRef">Refresh</button>
    </div>
    <section id="pDash"></section>
    <section id="pDev" class="hidden"></section>
    <section id="pDom" class="hidden"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}};

var cfg={url:LS.get("np_url"),key:LS.get("np_key")};
var sess=null; try{sess=JSON.parse(LS.get("np_sess")||"null")}catch(e){}
var st={devices:[],domains:[],page:"dash",q:"",onlyOn:false,hide:LS.get("np_hide")==="1",timer:null};

function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==="text")e.textContent=attrs[k];
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]===true)e.setAttribute(k,"");
    else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});
  return e;
}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild)}
function toast(msg,bad){var t=$("toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");clearTimeout(toast._t);toast._t=setTimeout(function(){t.className="toast hidden"},3500)}
function show(v){["vSetup","vLogin","app"].forEach(function(i){$(i).classList.toggle("hidden",i!==v)})}

/* ---------- API ---------- */
function base(){return cfg.url.replace(/\/+$/,"")}
function api(path,opt){
  opt=opt||{};
  return ensureToken().then(function(){
    var hd={apikey:cfg.key,Authorization:"Bearer "+sess.access_token,"Content-Type":"application/json"};
    if(opt.prefer)hd.Prefer=opt.prefer;
    return fetch(base()+path,{method:opt.method||"GET",headers:hd,body:opt.body?JSON.stringify(opt.body):undefined});
  }).then(function(r){
    if(r.status===401){logout();throw new Error("Session expired")}
    if(!r.ok)return r.text().then(function(t){var m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(m||("HTTP "+r.status))});
    return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function saveSess(j){
  sess={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};
  LS.set("np_sess",JSON.stringify(sess));
}
function authCall(grant,body){
  return fetch(base()+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Sign in failed");return j})});
}
function ensureToken(){
  if(!sess)return Promise.reject(new Error("Not signed in"));
  if(sess.exp-Date.now()>60000)return Promise.resolve();
  return authCall("refresh_token",{refresh_token:sess.refresh_token}).then(saveSess).catch(function(e){logout();throw e});
}
function logout(){sess=null;LS.del("np_sess");clearInterval(st.timer);show("vLogin")}

/* ---------- data ---------- */
function load(){
  return Promise.all([
    api("/rest/v1/panel_devices?select=*"),
    api("/rest/v1/domains?select=*&order=id")
  ]).then(function(r){
    st.devices=r[0]||[];st.domains=r[1]||[];
    var d=new Date();$("stamp").textContent="Updated "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    render();
  }).catch(function(e){toast(e.message,true)});
}
function latest(){return st.devices.reduce(function(m,d){return Math.max(m,d.app_code||0)},0)}
function ago(s){
  if(!s)return "-";
  var t=/[zZ]|[+-]\d\d(:?\d\d)?$/.test(s)?s:s.replace(" ","T")+"+03:00";
  var ms=Date.now()-new Date(t).getTime();if(isNaN(ms))return s;
  var m=Math.round(ms/60000);
  if(m<1)return "just now";if(m<60)return m+"m ago";
  var hr=Math.round(m/60);if(hr<48)return hr+"h ago";
  return Math.round(hr/24)+"d ago";
}
function mask(u){return st.hide?"••••••••••":u}

/* ---------- render ---------- */
function render(){
  $("pDash").classList.toggle("hidden",st.page!=="dash");
  $("pDev").classList.toggle("hidden",st.page!=="dev");
  $("pDom").classList.toggle("hidden",st.page!=="dom");
  $("title").textContent={dash:"Dashboard",dev:"Devices",dom:"Domains"}[st.page];
  Array.prototype.forEach.call(document.querySelectorAll("nav button[data-p]"),function(b){b.classList.toggle("on",b.dataset.p===st.page)});
  if(st.page==="dash")rDash();else if(st.page==="dev")rDev();else rDom();
}
function rDash(){
  var p=$("pDash");clear(p);
  var on=st.devices.filter(function(d){return d.online}).length,L=latest();
  var old=st.devices.filter(function(d){return (d.app_code||0)<L}).length;
  function c(n,l){return h("div",{class:"card"},[h("div",{class:"n",text:String(n)}),h("div",{class:"l",text:l})])}
  p.appendChild(h("div",{class:"cards"},[c(on,"Online now"),c(st.devices.length,"Devices"),c(old,"Old version")]));
}
function rDev(){
  var p=$("pDev");
  var keep=document.activeElement&&document.activeElement.id==="qBox";
  clear(p);
  var q=h("input",{id:"qBox",type:"search",placeholder:"Search username or MAC",value:st.q,oninput:function(e){st.q=e.target.value;rows()}});
  var cb=h("input",{type:"checkbox",onchange:function(e){st.onlyOn=e.target.checked;rows()}});cb.checked=st.onlyOn;
  p.appendChild(h("div",{class:"tools"},[q,h("label",{class:"chk",style:"margin:0"},[cb,"Online only"])]));
  var tb=h("tbody");
  p.appendChild(h("div",{class:"tw"},[h("table",null,[
    h("thead",null,[h("tr",null,["Username","MAC","Country","Version","Status","Domain"].map(function(x){return h("th",{text:x})}))]),tb])]));
  var empty=h("div",{class:"empty",text:"No devices"});p.appendChild(empty);
  function rows(){
    clear(tb);
    var s=st.q.trim().toLowerCase();
    var list=st.devices.filter(function(d){
      if(st.onlyOn&&!d.online)return false;
      return !s||(d.username||"").toLowerCase().indexOf(s)>=0||(d.mac||"").toLowerCase().indexOf(s)>=0;
    });
    empty.classList.toggle("hidden",list.length>0);
    list.forEach(function(d){
      var sel=h("select",{onchange:function(e){setDomain(d,e.target.value,sel)}});
      st.domains.forEach(function(x){
        var o=h("option",{value:String(x.id),text:"#"+x.id+(x.is_default?" (default)":"")+(x.active?"":" (off)")});
        if(x.id===d.domain_no)o.selected=true;sel.appendChild(o);
      });
      tb.appendChild(h("tr",null,[
        h("td",{text:d.username||"-"}),
        h("td",{class:"mono",text:d.mac||"-"}),
        h("td",{text:d.country_name||d.country||"-"}),
        h("td",{text:d.app_version||"-"}),
        h("td",null,[h("span",{class:"dot"+(d.online?" on":"")}),d.online?"Online":ago(d.last_seen_kw)]),
        h("td",null,[sel])
      ]));
    });
  }
  rows();
  if(keep){var qb=$("qBox");qb.focus();qb.setSelectionRange(qb.value.length,qb.value.length)}
}
function setDomain(d,val,sel){
  var id=parseInt(val,10);
  sel.disabled=true;
  api("/rest/v1/customers?username=eq."+encodeURIComponent(d.username),{method:"PATCH",body:{domain_id:id},prefer:"return=representation"})
   .then(function(r){
     if(!r||!r.length)throw new Error("Not saved (no matching customer)");
     d.domain_no=id;toast("Domain updated for "+d.username);
   }).catch(function(e){toast(e.message,true);sel.value=String(d.domain_no)})
   .then(function(){sel.disabled=false});
}
function rDom(){
  var p=$("pDom");clear(p);
  var hide=h("input",{type:"checkbox",onchange:function(e){st.hide=e.target.checked;LS.set("np_hide",st.hide?"1":"0");rDom()}});hide.checked=st.hide;
  var inp=h("input",{id:"newUrl",placeholder:"http://newdomain.com/"});
  p.appendChild(h("div",{class:"row"},[inp,h("button",{class:"btn",text:"New",onclick:function(){addDomain(inp.value)}}),
    h("label",{class:"chk",style:"margin:0 0 0 auto"},[hide,"Hide links"])]));
  var tb=h("tbody");
  p.appendChild(h("div",{class:"tw"},[h("table",null,[
    h("thead",null,[h("tr",null,["#","URL","Default","Active"].map(function(x){return h("th",{text:x})}))]),tb])]));
  var count={};st.devices.forEach(function(d){count[d.domain_no]=(count[d.domain_no]||0)+1});
  if(!st.domains.length)p.appendChild(h("div",{class:"empty",text:"No domains"}));
  st.domains.forEach(function(x){
    var act=h("input",{type:"checkbox",onchange:function(e){toggleActive(x,e.target)}});act.checked=!!x.active;
    var def=x.is_default?h("span",{class:"tag",text:"Default"}):h("button",{class:"btn ghost",text:"Set default",onclick:function(){setDefault(x)}});
    tb.appendChild(h("tr",null,[
      h("td",{text:String(x.id)}),
      h("td",{class:"mono",text:mask(x.url)+(count[x.id]?"  ("+count[x.id]+" devices)":"")}),
      h("td",null,[def]),
      h("td",null,[h("label",{class:"sw"},[act,h("span")])])
    ]));
  });
}
function addDomain(url){
  url=(url||"").trim();
  if(!/^https?:\/\/.+/i.test(url)){toast("URL must start with http:// or https://",true);return}
  if(!/\/$/.test(url))url+="/";
  var id=st.domains.reduce(function(m,d){return Math.max(m,d.id)},0)+1;
  api("/rest/v1/domains",{method:"POST",body:{id:id,url:url,is_default:false,active:true}})
   .then(function(){toast("Domain added");return load()}).catch(function(e){toast(e.message,true)});
}
function toggleActive(x,box){
  var v=box.checked;
  if(!v&&x.is_default){box.checked=true;toast("Set another default first",true);return}
  api("/rest/v1/domains?id=eq."+x.id,{method:"PATCH",body:{active:v}})
   .then(function(){x.active=v;toast(v?"Activated":"Deactivated")}).catch(function(e){box.checked=!v;toast(e.message,true)});
}
function setDefault(x){
  if(!x.active){toast("Activate this domain first",true);return}
  api("/rest/v1/rpc/set_default_domain",{method:"POST",body:{p_id:x.id}})
   .then(function(){toast("Default changed");return load()}).catch(function(e){toast(e.message,true)});
}

/* ---------- wiring ---------- */
function start(){
  show("app");load();
  clearInterval(st.timer);
  st.timer=setInterval(function(){
    if(document.hidden||st.page==="dom"&&document.activeElement&&document.activeElement.id==="newUrl")return;
    load();
  },60000);
}
function boot(){
  if(!cfg.url||!cfg.key){show("vSetup");return}
  if(sess)start();else show("vLogin");
}
$("fSetup").addEventListener("submit",function(e){
  e.preventDefault();
  var u=$("sUrl").value.trim(),k=$("sKey").value.trim();
  if(!/^https:\/\/[^\s/]+\.supabase\.co\/?$/i.test(u)){$("eSetup").textContent="URL must look like https://xxxx.supabase.co";return}
  cfg={url:u,key:k};LS.set("np_url",u);LS.set("np_key",k);$("sKey").value="";show("vLogin");
});
$("bReset").addEventListener("click",function(){LS.del("np_url");LS.del("np_key");cfg={};show("vSetup")});
$("fLogin").addEventListener("submit",function(e){
  e.preventDefault();$("eLogin").textContent="";$("bLogin").disabled=true;
  authCall("password",{email:$("lEmail").value.trim(),password:$("lPass").value})
   .then(function(j){saveSess(j);$("lPass").value="";start()})
   .catch(function(er){$("eLogin").textContent=er.message})
   .then(function(){$("bLogin").disabled=false});
});
$("bOut").addEventListener("click",logout);
$("bRef").addEventListener("click",load);
Array.prototype.forEach.call(document.querySelectorAll("nav button[data-p]"),function(b){
  b.addEventListener("click",function(){st.page=b.dataset.p;render()});
});
boot();
})();
</script>
</body>
</html>
